<!DOCTYPE html>
<html lang="zh‑CN">
<head>
<meta charset="UTF‑8" />
<meta name="viewport" content="width=device‑width, initial‑scale=1.0"/>
<title>文字烧入视频帧PiP（仅前台有效）</title>
<style>
body{background:#111;color:#fff;padding:20px;}
button{padding:12px 20px;font‑size:16px;margin:4px;}
#tip{color:#ff9800;margin‑bottom:10px;}
</style>
</head>
<body>
<div id="tip">⚠️iOS：仅Safari前台时PiP会更新文字；切App后台画面定格，新文字无法刷新</div>
<button id="openPiPBtn">打开PiP</button>
<button id="changeTextBtn">模拟推送新文字</button>

<canvas id="drawCanvas" width="360" height="640" style="display:none;"></canvas>
<video id="pipVideo" muted playsinline style="display:none;"></video>

<script>
const canvas = document.getElementById('drawCanvas');
const ctx = canvas.getContext('2d');
const video = document.getElementById('pipVideo');
const openPiPBtn = document.getElementById('openPiPBtn');
const changeTextBtn = document.getElementById('changeTextBtn');

let currentText = "初始提词文字\n第一行\n第二行";
let pipActive = false;
let mediaSource = null;
let queue = [];
let sourceBuffer = null;

// 渲染文字到canvas
function renderCanvas(text){
  ctx.fillStyle="#000";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#ffffff";
  ctx.font="bold 28px sans‑serif";
  ctx.textAlign="center";
  const lines = text.split('\n');
  lines.forEach((line,i)=>{
    ctx.fillText(line, canvas.width/2, 80 + i*46);
  });
}

// 初始化MSE
async function initMSE(){
  mediaSource = new MediaSource();
  video.src = URL.createObjectURL(mediaSource);
  await new Promise(resolve=>{
    mediaSource.addEventListener('sourceopen',resolve,{once:true});
  });
  // 注意：iOS Safari对MP4编码兼容性很差，很多版本这里直接抛异常
  sourceBuffer = mediaSource.addSourceBuffer('video/mp4; codecs="avc1.42E01E"');
}

openPiPBtn.addEventListener('click',async ()=>{
  try{
    renderCanvas(currentText);
    await initMSE();
    await video.play();
    await video.requestPictureInPicture();
    pipActive = true;
  }catch(e){
    alert("PiP初始化失败："+e.message);
    console.error(e);
  }
});

changeTextBtn.addEventListener('click',()=>{
  currentText = "更新后的提词\nElectron卡顿排查\n主线程阻塞优化";
  renderCanvas(currentText);
  // ⚠️重点：iOS一旦切后台，这里虽然会执行，但无法把新帧送入video，PiP画面不会变
});

renderCanvas(currentText);
</script>
</body>
</html>
