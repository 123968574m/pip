<!DOCTYPE html>
<html lang="zh‑CN">
<head>
<meta charset="UTF‑8" />
<meta name="viewport" content="width=device‑width, initial‑scale=1.0"/>
<title>PiP提词器Fix</title>
<style>
body{background:#111;color:#fff;padding:20px;}
#canvasBox{display:none;}
button{padding:12px 24px;font‑size:16px;margin:8px 0;}
</style>
</head>
<body>
<h3>PiP画中画提词（修复Safari报错）</h3>
<button id="openPipBtn">👉点击打开画中画（仅点一次）</button>
<button id="setTxtBtn">更新提词文本</button>
<div id="canvasBox">
<canvas id="tcCanvas" width="360" height="640"></canvas>
<video id="tcVideo" muted playsinline></video>
</div>

<script>
const canvas = document.getElementById('tcCanvas');
const ctx = canvas.getContext('2d');
const video = document.getElementById('tcVideo');
const openBtn = document.getElementById('openPipBtn');
const setTxtBtn = document.getElementById('setTxtBtn');

let teleText = "面试提词示例：\n先讲项目背景，再讲技术难点，最后讲收获。";
let pipActive = false;

function drawText(text){
  ctx.fillStyle="#000";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#ffffff";
  ctx.font="bold 26px sans‑serif";
  ctx.textAlign="center";
  const lines = text.split('\n');
  lines.forEach((line,i)=>{
    ctx.fillText(line, canvas.width/2, 80 + i*44);
  })
}

// 监听pip关闭事件
video.addEventListener('leavepictureinpicture', ()=>{
  pipActive = false;
})

const stream = canvas.captureStream(30);
video.srcObject = stream;

openBtn.addEventListener('click',async ()=>{
  if(pipActive) return;
  try{
    drawText(teleText);
    await video.play();
    await video.requestPictureInPicture();
    pipActive = true;
  }catch(e){
    alert("PiP唤起失败："+e.message+"，请使用iOS Safari");
    console.error(e);
  }
})

setTxtBtn.onclick = ()=>{
  teleText = "更新后的提词：\n我负责Electron渲染进程卡顿排查，定位到大图片base64同步阻塞主线程。\n采用WebWorker或者FormData流上传解决鼠标漂移。";
  drawText(teleText);
}
drawText(teleText);
</script>
</body>
</html>
