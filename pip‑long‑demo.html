<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全平台提词器</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "微软雅黑", sans-serif; background: #1a1a1a; color: #fff; padding: 20px; }
        .control-panel { margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        button { padding: 8px 16px; border: none; border-radius: 4px; background: #2563eb; color: #fff; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        input[type="range"] { width: 150px; }
        #pip-install { flex: 1; min-width: 200px; padding: 6px 10px; border-radius: 4px; border: 1px solid #333; background: #222; color: #fff; }
        .editor { width: 100%; height: 200px; padding: 15px; background: #222; color: #fff; border: 1px solid #333; border-radius: 4px; resize: vertical; margin-bottom: 15px; font-size: 16px; line-height: 1.6; }
        
        /* 提词器滚动区域 */
        .prompter-container {
            width: 100%;
            height: 300px;
            overflow: hidden;
            position: relative;
            background: #000;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        .prompter-content {
            padding: 40px 60px;
            font-size: 32px;
            line-height: 1.8;
            transform: translateY(0);
            transition: transform 0.1s linear;
            white-space: pre-wrap;
        }
        .indicator {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background: #ff4444;
            transform: translateY(-50%);
            z-index: 10;
        }

        /* video 不能 display:none，否则 iOS 可能拒绝进入画中画 */
        #pip-canvas { display: none; }
        #pip-video {
            position: fixed;
            width: 1px;
            height: 1px;
            right: 0;
            bottom: 0;
            opacity: 0.01;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="control-panel">
        <input type="text" id="pip-install" placeholder="输入pip包名，如：python-docx">
        <button onclick="installPackage()">pip 安装</button>
        <button id="float-button" onclick="toggleFloat()">开启全局悬浮</button>
        <button onclick="toggleScroll()">播放/暂停</button>
        <span>速度:</span>
        <input type="range" id="speed" min="0.5" max="5" step="0.5" value="2">
    </div>

    <textarea class="editor" id="script-input" placeholder="在这里输入你的提词稿...">欢迎使用全平台提词器
支持浏览器端Python pip安装包
iOS/安卓/桌面端通用悬浮显示
可自由调整滚动速度和字体大小</textarea>

    <div class="prompter-container" id="prompter-box">
        <div class="indicator"></div>
        <div class="prompter-content" id="prompter-text"></div>
    </div>

    <!-- iOS 视频画中画专用 -->
    <canvas id="pip-canvas" width="800" height="300"></canvas>
    <video id="pip-video" playsinline webkit-playsinline muted></video>
    <div id="status" role="status" aria-live="polite"></div>

    <script>
        let pyodide = null;
        let isScrolling = false;
        let scrollPosition = 0;
        let scrollSpeed = 2;
        let animationId = null;
        let pipWindow = null;
        let iosPiPActive = false;
        let canvasStream = null;
        let iosRenderId = null;

        // 初始化Pyodide
        async function initPyodide() {
            pyodide = await loadPyodide();
            await pyodide.loadPackage("micropip");
            console.log("Python环境初始化完成");
        }

        // pip安装包
        async function installPackage() {
            const packageName = document.getElementById("pip-install").value.trim();
            if (!packageName) return;
            const micropip = pyodide.pyimport("micropip");
            try {
                await micropip.install(packageName);
                alert(`成功安装包: ${packageName}`);
            } catch (e) {
                alert(`安装失败: ${e.message}\n仅支持纯Python包`);
            }
        }

        // 智能悬浮：自动判断设备用对应方案
        async function toggleFloat() {
            // 优先用桌面端文档画中画
            if (window.documentPictureInPicture) {
                if (pipWindow) {
                    pipWindow.close();
                    pipWindow = null;
                    return;
                }
                startDocumentPiP();
            } 
            // iOS / 其他设备用视频画中画
            else if (document.pictureInPictureEnabled &&
                     typeof HTMLVideoElement.prototype.requestPictureInPicture === 'function') {
                if (iosPiPActive) {
                    await document.exitPictureInPicture();
                    iosPiPActive = false;
                    return;
                }
                await startIosVideoPiP();
            } 
            else {
                alert("当前浏览器不支持悬浮功能，请使用iOS Safari、桌面Chrome/Edge");
            }
        }

        // ========== 桌面端：文档画中画 ==========
        async function startDocumentPiP() {
            try {
                pipWindow = await window.documentPictureInPicture.requestWindow({
                    width: 800, height: 300
                });
            } catch (e) {
                showStatus(`桌面画中画启动失败：${e.message}。请通过 HTTPS 访问页面。`);
                return;
            }
            const style = document.createElement('style');
            style.textContent = `
                body { margin: 0; background: #000; color: #fff; font-family: "微软雅黑", sans-serif; }
                .prompter-container { width: 100%; height: 100vh; overflow: hidden; position: relative; }
                .prompter-content { padding: 40px 60px; font-size: 32px; line-height: 1.8; }
                .indicator { position: absolute; top: 50%; left: 0; right: 0; height: 2px; background: #ff4444; transform: translateY(-50%); z-index: 10; }
            `;
            pipWindow.document.head.appendChild(style);
            const container = document.createElement('div');
            container.className = 'prompter-container';
            container.innerHTML = `
                <div class="indicator"></div>
                <div class="prompter-content" id="pip-prompter-text">${document.getElementById('prompter-text').innerText}</div>
            `;
            pipWindow.document.body.appendChild(container);
            syncScroll();
            pipWindow.addEventListener('pagehide', () => { pipWindow = null; });
        }

        // ========== iOS：视频画中画 ==========
        async function startIosVideoPiP() {
            const canvas = document.getElementById('pip-canvas');
            const video = document.getElementById('pip-video');
            const ctx = canvas.getContext('2d');

            if (!canvas.captureStream || !video.requestPictureInPicture) {
                showStatus('此浏览器不支持网页画中画，请使用最新版 iOS Safari。');
                return;
            }

            // 画布是视频源，视频元素负责让 iOS 接管画中画窗口。
            function renderCanvas() {
                // 黑色背景
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 红色指示线
                ctx.strokeStyle = '#ff4444';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, canvas.height / 2);
                ctx.lineTo(canvas.width, canvas.height / 2);
                ctx.stroke();

                // 绘制文字
                ctx.fillStyle = '#ffffff';
                ctx.font = '28px 微软雅黑, sans-serif';
                ctx.textBaseline = 'top';
                
                const text = document.getElementById('prompter-text').innerText;
                const lines = text.split('\n');
                const lineHeight = 50;
                const startY = 40 - scrollPosition;
                const paddingX = 40;

                for (let i = 0; i < lines.length; i++) {
                    const y = startY + i * lineHeight;
                    if (y > -lineHeight && y < canvas.height) {
                        ctx.fillText(lines[i], paddingX, y);
                    }
                }

                iosRenderId = requestAnimationFrame(renderCanvas);
            }

            // 捕获canvas为视频流
            canvasStream = canvas.captureStream(30);
            video.srcObject = canvasStream;
            
            try {
                await video.play();
                await video.requestPictureInPicture();
                iosPiPActive = true;
                renderCanvas();
                showStatus('画中画已开启。现在切换到其他 App，提词器会继续显示。');

                // 监听退出
                video.addEventListener('leavepictureinpicture', () => {
                    iosPiPActive = false;
                    cancelAnimationFrame(iosRenderId);
                    video.srcObject = null;
                    canvasStream = null;
                    showStatus('画中画已关闭。');
                });
            } catch (e) {
                showStatus(`画中画启动失败：${e.message}。请用最新版 iOS Safari，并直接点击按钮启动。`);
            }
        }

        // 同步滚动状态
        function syncScroll() {
            const content = document.getElementById('prompter-text');
            content.style.transform = `translateY(${-scrollPosition}px)`;
            
            if (pipWindow) {
                const pipText = pipWindow.document.getElementById('pip-prompter-text');
                if (pipText) pipText.style.transform = `translateY(${-scrollPosition}px)`;
            }
        }

        // 播放/暂停
        function toggleScroll() {
            isScrolling = !isScrolling;
            if (isScrolling) {
                scrollAnimation();
            } else {
                cancelAnimationFrame(animationId);
            }
        }

        function scrollAnimation() {
            scrollPosition += scrollSpeed;
            syncScroll();
            animationId = requestAnimationFrame(scrollAnimation);
        }

        function showStatus(message) {
            document.getElementById('status').textContent = message;
        }

        // 速度调节
        document.getElementById('speed').addEventListener('input', (e) => {
            scrollSpeed = parseFloat(e.target.value);
        });

        // 文本同步
        document.getElementById('script-input').addEventListener('input', (e) => {
            document.getElementById('prompter-text').innerText = e.target.value;
            scrollPosition = 0;
        });

        // 初始化
        window.onload = () => {
            initPyodide();
            document.getElementById('prompter-text').innerText = document.getElementById('script-input').value;
        };
    </script>
</body>
</html>
