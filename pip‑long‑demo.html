<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>iOS PiP 字幕测试</title>
<style>
body{background:#111;color:#fff;padding:20px;}
button{padding:14px 24px;font-size:16px;margin:8px 0;}
video{width:320px;background:#000;}
</style>
</head>
<body>
<h3>iOS PiP 字幕方案测试</h3>
<button id="openBtn">打开画中画</button>
<button id="updateBtn">模拟更新文字</button>
<br><br>
<video id="player" muted playsinline loop controls>
  <!-- 这里放一个黑屏mp4，你可以自己传一个10秒黑屏视频到仓库 -->
  <source src="black.mp4" type="video/mp4">
  <track id="subtitleTrack" kind="subtitles" srclang="zh" label="中文" default>
</video>

<script>
const video = document.getElementById('player');
const track = document.getElementById('subtitleTrack');
const openBtn = document.getElementById('openBtn');
const updateBtn = document.getElementById('updateBtn');

// 等待视频加载完成
video.addEventListener('loadedmetadata', ()=>{
  const textTrack = video.textTracks[0];
  textTrack.mode = 'showing';

  // 初始字幕
  const cue = new VTTCue(0, 9999, "初始提词文字\n第一行\n第二行");
  textTrack.addCue(cue);

  // 更新文字函数：WebSocket收到消息时调用
  function updateSubtitle(text){
    // 清空旧字幕
    const cues = textTrack.cues;
    for(let i=cues.length-1; i>=0; i--){
      textTrack.removeCue(cues[i]);
    }
    // 添加新字幕，时长设为9999秒保持常显
    const newCue = new VTTCue(video.currentTime, video.currentTime + 9999, text);
    textTrack.addCue(newCue);
  }

  // 打开PiP
  openBtn.addEventListener('click', ()=>{
    video.play();
    video.requestPictureInPicture()
      .then(()=>console.log('PiP打开成功'))
      .catch(e=>alert('PiP失败：'+e.message));
  });

  // 模拟更新文字
  updateBtn.onclick = ()=>{
    updateSubtitle("更新后的提词：\nElectron渲染卡顿排查\n主线程阻塞优化方案");
  };

  // 暴露给全局，WebSocket里直接调用
  window.updateTeleprompter = updateSubtitle;
});
</script>
</body>
</html>
