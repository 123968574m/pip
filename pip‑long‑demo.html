<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全平台提词器v1.0</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "微软雅黑", sans-serif; background: #1a1a1a; color: #fff; padding: 20px; }
        .control-panel { margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        button { padding: 8px 16px; border: none; border-radius: 4px; background: #2563eb; color: #fff; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        input[type="range"] { width: 150px; }
        .editor { width: 100%; height: 200px; padding: 15px; background: #222; color: #fff; border: 1px solid #333; border-radius: 4px; resize: vertical; margin-bottom: 15px; font-size: 16px; line-height: 1.6; }
        
        /* 提词器滚动区域 */
        .prompter-container {
            width: 100%;
            height: 300px;
            overflow: hidden;
            position: relative;
            background: #000;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        .prompter-content {
            padding: 40px 60px;
            font-size: 32px;
            line-height: 1.8;
            transform: translateY(0);
            transition: transform 0.1s linear;
            white-space: pre-wrap;
        }
        .indicator {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background: #ff4444;
            transform: translateY(-50%);
            z-index: 10;
        }

        /* video 不能 display:none，否则 iOS 可能拒绝进入画中画 */
        #pip-canvas { display: none; }
        #pip-video {
            position: fixed;
            width: 1px;
            height: 1px;
            right: 0;
            bottom: 0;
            opacity: 0.01;
            pointer-events: none;
        }
        #status { min-height: 24px; color: #facc15; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="control-panel">
        <button id="float-button" onclick="togglePiP()">准备 iOS 悬浮窗</button>
        <button onclick="toggleScroll()">播放/暂停</button>
        <span>速度:</span>
        <input type="range" id="speed" min="0.5" max="5" step="0.5" value="2">
    </div>

    <textarea class="editor" id="script-input" placeholder="在这里输入你的提词稿...">欢迎使用全平台提词器
支持浏览器端Python pip安装包
iOS/安卓/桌面端通用悬浮显示
可自由调整滚动速度和字体大小</textarea>

    <div class="prompter-container" id="prompter-box">
        <div class="indicator"></div>
        <div class="prompter-content" id="prompter-text"></div>
    </div>

    <canvas id="pip-canvas" width="800" height="300"></canvas>
    <video id="pip-video" playsinline webkit-playsinline muted></video>
    <div id="status" role="status" aria-live="polite"></div>

    <script>
        let isScrolling = false;
        let scrollPosition = 0;
        let scrollSpeed = 2;
        let animationId = null;
        let canvasStream = null;
        let iosRenderId = null;
        let pipPrepared = false;

        async function togglePiP() {
            const canvas = document.getElementById('pip-canvas');
            const video = document.getElementById('pip-video');

            if (!document.pictureInPictureEnabled ||
                typeof video.requestPictureInPicture !== 'function' ||
                typeof canvas.captureStream !== 'function') {
                showStatus('当前浏览器不支持，请使用 HTTPS 下的最新版 iOS Safari。');
                return;
            }

            if (document.pictureInPictureElement) {
                await document.exitPictureInPicture();
                return;
            }

            if (!pipPrepared) {
                canvasStream = canvas.captureStream(30);
                video.srcObject = canvasStream;
                video.muted = true;
                video.playsInline = true;
                drawPiPFrame();
                await video.play();
                pipPrepared = true;
                document.getElementById('float-button').textContent = '开启 iOS 悬浮窗';
                showStatus('视频流已准备，请再次点击“开启 iOS 悬浮窗”。');
                return;
            }

            try {
                await video.requestPictureInPicture();
                document.getElementById('float-button').textContent = '关闭 iOS 悬浮窗';
                showStatus('画中画已开启，现在可以切换到其他 App。');
            } catch (e) {
                showStatus(`画中画启动失败：${e.message}。请再次点击按钮重试。`);
            }
        }

        function drawPiPFrame() {
            const canvas = document.getElementById('pip-canvas');
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#f44';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2);
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();
            ctx.fillStyle = '#fff';
            ctx.font = '28px sans-serif';
            ctx.textBaseline = 'top';
            document.getElementById('prompter-text').innerText.split('\n').forEach((line, index) => {
                const y = 40 - scrollPosition + index * 50;
                if (y > -50 && y < canvas.height) ctx.fillText(line, 40, y);
            });
            iosRenderId = requestAnimationFrame(drawPiPFrame);
        }

        // 同步滚动状态
        function syncScroll() {
            const content = document.getElementById('prompter-text');
            content.style.transform = `translateY(${-scrollPosition}px)`;
        }

        // 播放/暂停
        function toggleScroll() {
            isScrolling = !isScrolling;
            if (isScrolling) {
                scrollAnimation();
            } else {
                cancelAnimationFrame(animationId);
            }
        }

        function scrollAnimation() {
            scrollPosition += scrollSpeed;
            syncScroll();
            animationId = requestAnimationFrame(scrollAnimation);
        }

        function showStatus(message) {
            document.getElementById('status').textContent = message;
        }

        // 速度调节
        document.getElementById('speed').addEventListener('input', (e) => {
            scrollSpeed = parseFloat(e.target.value);
        });

        // 文本同步
        document.getElementById('script-input').addEventListener('input', (e) => {
            document.getElementById('prompter-text').innerText = e.target.value;
            scrollPosition = 0;
        });

        document.getElementById('pip-video').addEventListener('leavepictureinpicture', () => {
            cancelAnimationFrame(iosRenderId);
            pipPrepared = false;
            canvasStream = null;
            document.getElementById('pip-video').srcObject = null;
            document.getElementById('float-button').textContent = '准备 iOS 悬浮窗';
            showStatus('画中画已关闭。');
        });

        // 初始化
        window.onload = () => {
            document.getElementById('prompter-text').innerText = document.getElementById('script-input').value;
        };
    </script>
</body>
</html>
