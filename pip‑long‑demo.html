<!DOCTYPE html>
<html lang="zh‑CN">
<head>
<meta charset="UTF‑8" />
<meta name="viewport" content="width=device‑width, initial‑scale=1.0"/>
<title>iOS Safari PiP极限测试</title>
<style>
body{background:#111;color:#fff;padding:20px;}
#canvasBox{display:none;}
button{padding:14px 24px;font‑size:16px;margin:8px 0;}
</style>
</head>
<body>
<h3>PiP测试（仅原生Safari HTTPS）</h3>
<button id="openBtn">打开画中画</button>
<button id="updateBtn">更新文字</button>
<div id="canvasBox">
<canvas id="tcCanvas" width="320" height="560"></canvas>
<video id="tcVideo" muted playsinline></video>
</div>

<script>
const canvas = document.getElementById('tcCanvas');
const ctx = canvas.getContext('2d');
const video = document.getElementById('tcVideo');
const openBtn = document.getElementById('openBtn');
const updateBtn = document.getElementById('updateBtn');

let textContent = "面试示例文字\n第一行\n第二行";
let pipOn = false;

function render(txt){
  ctx.fillStyle="#000";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#fff";
  ctx.font="bold 24px sans‑serif";
  ctx.textAlign="center";
  const arr = txt.split('\n');
  arr.forEach((s,i)=>ctx.fillText(s,canvas.width/2,70+i*42));
}

video.addEventListener('leavepictureinpicture',()=>{
  pipOn = false;
})

// 使用touchend，全部逻辑同步，不写await，不写Promise await
openBtn.addEventListener('touchend', function(e){
  e.preventDefault();
  if(pipOn) return;
  render(textContent);
  // 全部媒体操作，全部放在touchend同步栈内
  const stream = canvas.captureStream(25);
  video.srcObject = stream;
  video.play();
  // 直接同步调用requestPictureInPicture，不await
  video.requestPictureInPicture()
  .then(()=>{
    pipOn = true;
    console.log("PiP打开成功");
  })
  .catch(err=>{
    alert("PiP失败："+err.message);
    console.error(err);
  })
})

updateBtn.onclick = ()=>{
  textContent = "更新内容：\nElectron卡顿排查\nbase64主线程阻塞";
  render(textContent);
}

render(textContent);
</script>
</body>
</html>
