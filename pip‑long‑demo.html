<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"/>
<title>提词器｜iOS全屏稳定版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;
  height:100%;
  background:#000;
  color:#ffffff;
  overflow:hidden;
}
#content{
  width:100%;
  height:calc(100% - 100px);
  font-size:34px;
  line-height:1.7;
  font-weight:bold;
  text-align:center;
  padding:40px 20px;
  white-space:pre‑line;
}
.ctrl{
  position:fixed;
  bottom:10px;
  left:0;
  right:0;
  text‑align:center;
}
button{
  padding:14px 28px;
  font‑size:17px;
  margin:0 8px;
}
</style>
</head>
<body>
<div id="content">等待提词文字……</div>
<div class="ctrl">
  <button id="btnUpdate">模拟收到文字</button>
  <button id="btnClear">清空</button>
</div>

<script>
const domContent = document.getElementById('content');
const btnUpdate = document.getElementById('btnUpdate');
const btnClear = document.getElementById('btnClear');

// 更新提词，WebSocket收到消息调用这个函数
function setTeleprompterText(text){
  domContent.innerText = text;
}

// 模拟接收新提词
btnUpdate.addEventListener('click', function(){
  const mockText = `项目难点：
Electron渲染进程主线程阻塞
大图片转base64造成鼠标漂移卡顿

优化方案：
使用Canvas预渲染，避免主线程做大量同步编码；
优先FormData文件流上传，避开base64。`;
  setTeleprompterText(mockText);
});

btnClear.addEventListener('click', function(){
  setTeleprompterText("");
});

// 暴露全局，websocket外部可以直接调用 window.setTeleprompterText("xxx")
window.setTeleprompterText = setTeleprompterText;
</script>
</body>
</html>
