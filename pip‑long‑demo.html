<!DOCTYPE html>
<html lang="zh‑CN">
<head>
<meta charset="UTF‑8" />
<meta name="viewport" content="width=device‑width, initial‑scale=1.0, touch‑action: manipulation"/>
<title>PiP提词器最终兼容版</title>
<style>
body{background:#111;color:#fff;padding:20px;}
#canvasBox{display:none;}
button{padding:14px 24px;font‑size:16px;margin:8px 0;}
</style>
</head>
<body>
<h3>PiP画中画提词器</h3>
<button id="openBtn">打开画中画</button>
<button id="updateBtn">更新文字</button>
<div id="canvasBox">
<canvas id="tcCanvas" width="320" height="560"></canvas>
<video id="tcVideo" muted playsinline></video>
</div>

<script>
const canvas = document.getElementById('tcCanvas');
const ctx = canvas.getContext('2d');
const video = document.getElementById('tcVideo');
const openBtn = document.getElementById('openBtn');
const updateBtn = document.getElementById('updateBtn');

let textContent = "面试示例文字\n第一行\n第二行";
let pipOn = false;

function render(txt){
  ctx.fillStyle="#000";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#fff";
  ctx.font="bold 24px sans‑serif";
  ctx.textAlign="center";
  const arr = txt.split('\n');
  arr.forEach((s,i)=>ctx.fillText(s,canvas.width/2,70+i*42));
}

video.addEventListener('leavepictureinpicture',()=>{
  pipOn = false;
})

// ✅全局初始化流，不要放到click里面
const stream = canvas.captureStream(25);
video.srcObject = stream;
video.play();

// ✅只用click事件，不要touchend/touchstart
openBtn.addEventListener('click', function(){
  if(pipOn) return;
  render(textContent);
  // 仅requestPictureInPicture放在click同步栈
  video.requestPictureInPicture()
  .then(()=>{
    pipOn = true;
    console.log("PiP打开成功");
  })
  .catch(err=>{
    console.error(err);
    alert("PiP不可用，将在页面内展示提词："+err.message);
  })
})

updateBtn.onclick = ()=>{
  textContent = "更新内容：\nElectron卡顿排查\nbase64主线程阻塞";
  render(textContent);
}

render(textContent);
</script>
</body>
</html>
