<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, touch-action: manipulation"/>
<title>提词器｜文字转视频帧方案</title>
<style>
body{background:#111;color:#fff;padding:20px;}
button{padding:14px 24px;font-size:16px;margin:8px 0;}
.tip{color:#aaa;font-size:14px;margin-bottom:10px;}

.stage{
  position: fixed;
  right: 10px;
  top: 80px;
  width: 180px;
  height: 320px;
  border: 1px solid #666;
  background: #000;
  z-index: 9999;
  display: none;
}

.stage img{
  width: 100%;
  height: 100%;
  object-fit: contain;
}

#tcVideo{
  display: none;
}
</style>
</head>
<body>

<h3>提词器</h3>
<div class="tip" id="deviceTip"></div>
<button id="openBtn">打开提词窗口</button>
<button id="updateBtn">更新提词文本</button>

<div class="stage" id="stage">
  <img id="frameImg" alt="" />
</div>

<canvas id="tcCanvas" width="320" height="560" style="display:none"></canvas>
<video id="tcVideo" muted playsinline></video>

<script>
const canvas = document.getElementById('tcCanvas');
const ctx = canvas.getContext('2d');
const video = document.getElementById('tcVideo');
const frameImg = document.getElementById('frameImg');
const stage = document.getElementById('stage');
const openBtn = document.getElementById('openBtn');
const updateBtn = document.getElementById('updateBtn');
const deviceTip = document.getElementById('deviceTip');

let textContent = "面试示例文字\n第一行\n第二行";
let pipOn = false;

const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
const isAndroid = /Android/.test(navigator.userAgent);

if (isIOS) {
  deviceTip.innerText = "⚠️iOS：页面内显示文字视频帧，不使用 PiP";
  openBtn.innerText = "打开页面提词";
} else if (isAndroid) {
  deviceTip.innerText = "✅安卓：使用画中画悬浮提词";
  openBtn.innerText = "打开悬浮提词";
}

function renderTextToCanvas(text) {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 24px sans-serif";
  ctx.textAlign = "center";

  const lines = text.split("\n");
  const lineHeight = 42;
  const startY = (canvas.height - lines.length * lineHeight) / 2 + 30;

  lines.forEach((line, i) => {
    ctx.fillText(line, canvas.width / 2, startY + i * lineHeight);
  });
}

function updateFrame() {
  renderTextToCanvas(textContent);
  const dataUrl = canvas.toDataURL("image/png");

  if (isIOS) {
    frameImg.src = dataUrl;
  } else {
    video.src = dataUrl;
  }
}

video.addEventListener("leavepictureinpicture", () => {
  pipOn = false;
});

openBtn.addEventListener("click", function () {
  updateFrame();

  if (isIOS) {
    stage.style.display = stage.style.display === "block" ? "none" : "block";
    return;
  }

  if (pipOn) return;

  video.play().then(() => {
    return video.requestPictureInPicture();
  }).then(() => {
    pipOn = true;
    stage.style.display = "none";
  }).catch(err => {
    console.error("PiP失败", err);
    stage.style.display = "block";
  });
});

updateBtn.onclick = () => {
  textContent = "更新后的提词：\n我负责Electron渲染进程卡顿排查，定位到大图片base64同步阻塞主线程。\n采用WebWorker或FormData流上传优化。";
  updateFrame();
};

updateFrame();
</script>

</body>
</html>
